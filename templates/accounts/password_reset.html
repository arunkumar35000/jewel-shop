{% extends 'base.html' %}
{% block title %}Reset Password | AURA Jewellery{% endblock %}

{% block content %}
<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card p-4 p-md-5 border-gold-subtle shadow-sm bg-white rounded-3">
        <h3 class="serif-font fw-bold mb-2">Forgot Password</h3>
        <p class="text-muted small mb-4">Enter your registered email address to receive password reset instructions.</p>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-bold">Email Address</label>
            <input type="email" name="email" class="form-control py-2" required placeholder="you@example.com">
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-gold py-2 fw-bold">Send Reset Link</button>
            <a href="{% url 'login' %}" class="btn btn-outline-dark btn-sm mt-2">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
