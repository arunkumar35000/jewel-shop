{% extends 'base.html' %}
{% block title %}Delete Category | AURA Admin{% endblock %}

{% block content %}
<div class="container py-5 my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="card p-5 border-danger shadow-lg bg-white rounded-3">
        <div class="fs-1 text-danger mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <h3 class="serif-font fw-bold mb-2">Delete Category?</h3>
        <p class="text-muted small mb-4">
          Are you sure you want to delete category <strong>"{{ category.name }}"</strong>?
        </p>

        <form method="POST">
          {% csrf_token %}
          <div class="d-flex gap-3 justify-content-center">
            <button type="submit" class="btn btn-danger px-4 py-2 fw-bold">Delete Category</button>
            <a href="{% url 'admin_category_list' %}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
